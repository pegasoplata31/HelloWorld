name: Build Beyond Words APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/Guante-De-Voz-App/.gradle-build
    defaults:
      run:
        working-directory: Guante-De-Voz-App
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Preparar Android y logo
        run: python3 tool/prepare_android.py
      - name: Instalar dependencias
        run: flutter pub get
      - name: Analizar código
        run: flutter analyze
      - name: Probar protocolo BLE
        run: flutter test
      - name: Compilar APK
        run: flutter build apk --release --no-tree-shake-icons
      - name: Verificar y registrar APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk > apk-sha256.txt
          flutter --version > flutter-version.txt
          flutter pub deps --style=compact > dependencies.txt
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Beyond-Words-APK
          path: Guante-De-Voz-App/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Subir datos de compilación
        uses: actions/upload-artifact@v4
        with:
          name: Build-metadata
          path: |
            Guante-De-Voz-App/pubspec.lock
            Guante-De-Voz-App/apk-sha256.txt
            Guante-De-Voz-App/flutter-version.txt
            Guante-De-Voz-App/dependencies.txt
          if-no-files-found: error
          retention-days: 30
